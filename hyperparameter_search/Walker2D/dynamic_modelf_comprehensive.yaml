# Comprehensive Walker2D dynamics grid (all searchable knobs expanded).
# Task: walker2d-medium-replay-v2
#
# WARNING: cartesian product is large. Prefer:
#   python3 dynamic_model_search.py --config dynamic_modelf_comprehensive.yaml --seed 1
# then re-run the winning region with seeds: [1, 2, 3, 4, 5].
#
# Axes (approx with --seed 1):
#   1 epoch × 2 lr × 2 wd × 2 ens × 2 elites × 2 hidden × 2 holdout × 2 bs × 2 logvar
#   ≈ 256 runs (invalid elites>ensemble pairs are skipped; here all pairs are valid).

task: walker2d-medium-replay-v2
seed: 1
# Leave empty / override with --seed while exploring; set list for confirmation.
seeds: [1]

output_model_name_prefix: dynamics_walker2d

dynamics_max_epochs: [250]
dynamics_lr: [0.001, 0.0003]
dynamics_weight_decay_scale: [1.0, 2.0]
dynamics_weight_decay_base: [2.5e-5, 5.0e-5, 7.5e-5, 7.5e-5, 1.0e-4]

early_stopping: true
max_epochs_since_update: 10

n_ensemble: [5, 7]
n_elites: [3, 5]

dynamics_hidden_dims:
  - [200, 200, 200, 200]
  - [200, 200]

holdout_ratio: [0.1, 0.2]
dynamics_batch_size: [128, 256]
logvar_loss_coef: [0.01, 0.001]

reward_mode: twohot
num_reward_bins: 255
reward_loss_weight: 1.0
dynamics_loss_weight: 1.0

eval_num_trajs: 50
eval_fixed_trajs: true
eval_freq: 10

wandb:
  project: dynamics_walker2d_hyperparameter_search
